<style>
  :root{
    --cream:#FAF3E7;
    --paper:#FFFFFF;
    --crust:#5B3A21;
    --ink:#2E241A;
    --ink-soft:#6B5D4E;
    --wheat:#C98A2C;
    --wheat-soft:#F2DDB2;
    --burgundy:#8C3B34;
    --burgundy-soft:#F3DEDB;
    --sage:#5E7C4F;
    --sage-soft:#DEE8D6;
    --line:#E4D6BE;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  body{margin:0;}
  .app{
    background:var(--cream);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    min-height:100%;
    padding:20px 16px 60px;
    max-width:520px;
    margin:0 auto;
  }
  .brandrow{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:4px;}
  h1{font-family:'Fraunces',serif; font-weight:700; font-size:26px; color:var(--crust); margin:0; letter-spacing:-0.01em;}
  .eyebrow{font-size:11px; text-transform:uppercase; letter-spacing:0.12em; color:var(--wheat); font-weight:600; margin-bottom:6px;}
  .sub{font-size:13px; color:var(--ink-soft); margin:0 0 20px;}

  .tabs{display:flex; background:var(--wheat-soft); border-radius:999px; padding:4px; margin-bottom:22px; gap:4px;}
  .tab{flex:1; text-align:center; padding:10px 8px; border-radius:999px; font-size:13px; font-weight:600; color:var(--crust); cursor:pointer; transition:background .18s ease, color .18s ease; user-select:none;}
  .tab.active{background:var(--crust); color:#fff;}

  .card{background:var(--paper); border-radius:var(--radius); border:1px solid var(--line); padding:18px 16px; margin-bottom:14px; position:relative;}
  .card::before{content:''; position:absolute; left:14px; right:14px; top:0; height:0; border-top:1px dashed var(--line);}
  .card-title{font-family:'Fraunces',serif; font-weight:600; font-size:15px; color:var(--crust); margin:0 0 4px;}
  .card-hint{font-size:11.5px; color:var(--ink-soft); margin:0 0 12px;}

  label{display:block; font-size:12px; font-weight:600; color:var(--ink-soft); margin:12px 0 5px;}
  label:first-of-type{margin-top:0;}
  input[type=text], input[type=number], select, textarea{
    width:100%; padding:10px 12px; border-radius:10px; border:1.5px solid var(--line);
    background:var(--cream); font-family:'Inter',sans-serif; font-size:14px; color:var(--ink);
  }
  input:focus, select:focus, textarea:focus{outline:2px solid var(--wheat); outline-offset:1px; background:#fff;}
  textarea{resize:vertical; min-height:60px;}

  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}

  .segbtns{display:flex; gap:8px; flex-wrap:wrap;}
  .segbtn{flex:1; min-width:70px; text-align:center; padding:9px 6px; border-radius:10px; border:1.5px solid var(--line); background:var(--cream); font-size:12.5px; font-weight:600; color:var(--ink-soft); cursor:pointer; transition:.15s ease;}
  .segbtn.on-good{background:var(--sage-soft); border-color:var(--sage); color:var(--sage);}
  .segbtn.on-mid{background:var(--wheat-soft); border-color:var(--wheat); color:var(--wheat);}
  .segbtn.on-bad{background:var(--burgundy-soft); border-color:var(--burgundy); color:var(--burgundy);}

  .pctpreview{margin-top:10px; font-size:12px; color:var(--ink-soft);}
  .pctpreview b{color:var(--crust); font-size:14px;}

  .moneywrap{position:relative;}
  .moneywrap .moneypre{position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--ink-soft); font-weight:600; font-size:14px; pointer-events:none;}
  .moneywrap input{padding-left:24px;}

  .locbtn{
    display:flex; align-items:center; justify-content:center; gap:6px;
    width:100%; padding:10px; margin-top:8px;
    border:1.5px dashed var(--wheat); border-radius:10px;
    background:var(--wheat-soft); color:var(--crust);
    font-size:13px; font-weight:600; cursor:pointer;
  }
  .locresult{margin-top:8px; font-size:12px; color:var(--sage); display:none;}
  .locresult.show{display:block;}
  .locresult a{color:var(--crust);}

  .photogrid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .photoslot{
    border:1.5px dashed var(--line); border-radius:12px; background:var(--cream);
    text-align:center; padding:8px; position:relative; overflow:hidden; min-height:118px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px;
  }
  .photoslot img{width:100%; height:64px; object-fit:cover; border-radius:8px;}
  .photoslot .lbl{font-size:11px; color:var(--ink-soft); font-weight:600;}
  .photoslot .plus{font-size:20px; color:var(--wheat);}
  .photoslot.filled{border-style:solid; border-color:var(--sage);}
  .phototabs{display:flex; gap:5px; width:100%;}
  .phototab{
    flex:1; display:flex; align-items:center; justify-content:center; gap:3px;
    padding:5px 2px; border-radius:7px; background:var(--wheat-soft); color:var(--crust);
    font-size:10.5px; font-weight:700; cursor:pointer; position:relative;
  }
  .phototab input{position:absolute; inset:0; opacity:0; cursor:pointer;}

  .submitbar{position:sticky; bottom:0; margin-top:10px;}
  button.primary{width:100%; padding:14px; border:none; border-radius:12px; background:var(--crust); color:#fff; font-family:'Inter',sans-serif; font-weight:700; font-size:15px; cursor:pointer; box-shadow:0 4px 14px rgba(91,58,33,.25);}
  button.primary:disabled{opacity:.6; cursor:default;}
  button.primary:active{transform:translateY(1px);}

  .stampwrap{position:fixed; inset:0; background:rgba(46,36,26,.45); display:flex; align-items:center; justify-content:center; z-index:50; opacity:0; pointer-events:none; transition:opacity .2s ease;}
  .stampwrap.show{opacity:1; pointer-events:auto;}
  .stamp{width:168px; height:168px; border-radius:50%; border:5px solid var(--burgundy); color:var(--burgundy); display:flex; align-items:center; justify-content:center; flex-direction:column; font-family:'Fraunces',serif; font-weight:700; background:#fff9f2; transform:scale(.4) rotate(-14deg); transition:transform .35s cubic-bezier(.2,1.6,.4,1);}
  .stampwrap.show .stamp{transform:scale(1) rotate(-10deg);}
  .stamp span.big{font-size:15px; letter-spacing:.02em;}
  .stamp span.small{font-family:'Inter',sans-serif; font-weight:600; font-size:10px; margin-top:4px; letter-spacing:.08em; text-transform:uppercase;}

  .statgrid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px;}
  .stat{background:var(--paper); border:1px solid var(--line); border-radius:var(--radius); padding:14px;}
  .stat .num{font-family:'Fraunces',serif; font-weight:700; font-size:24px; color:var(--crust);}
  .stat .lbl{font-size:11px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.06em; margin-top:2px;}

  .rowcard{display:flex; justify-content:space-between; align-items:center; background:var(--paper); border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin-bottom:8px;}
  .rowcard .name{font-weight:600; font-size:14px; color:var(--ink);}
  .rowcard .meta{font-size:11px; color:var(--ink-soft); margin-top:2px;}
  .pill{font-size:12px; font-weight:700; padding:4px 10px; border-radius:999px;}
  .pill.good{background:var(--sage-soft); color:var(--sage);}
  .pill.mid{background:var(--wheat-soft); color:var(--wheat);}
  .pill.bad{background:var(--burgundy-soft); color:var(--burgundy);}
  .chiprow{display:flex; gap:8px; overflow-x:auto; padding-bottom:2px; margin-bottom:14px;}
  .chip{flex:0 0 auto; padding:7px 13px; border-radius:999px; border:1.5px solid var(--line); background:var(--paper); font-size:12.5px; font-weight:600; color:var(--ink-soft); cursor:pointer; white-space:nowrap;}
  .chip.active{background:var(--wheat); border-color:var(--wheat); color:#fff;}
  .chipselect{flex:0 0 auto; padding:7px 26px 7px 13px; border-radius:999px; border:1.5px solid var(--line); background:var(--paper); font-size:12.5px; font-weight:600; color:var(--ink-soft); appearance:none; -webkit-appearance:none;}
  .medal{width:24px; height:24px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; flex-shrink:0;}
  .medal.gold{background:var(--wheat); color:#fff;}
  .medal.silver{background:#C7C2B8; color:#fff;}
  .medal.low{background:var(--burgundy-soft); color:var(--burgundy);}
  .medal.mid{background:var(--cream); color:var(--ink-soft); border:1px solid var(--line);}
  .alertrow{display:flex; justify-content:space-between; align-items:flex-start; gap:10px; padding:9px 0; border-top:1px solid var(--line);}
  .alertrow:first-of-type{border-top:none;}
  .alertrow .name{font-size:13px; font-weight:600; color:var(--ink);}
  .alertrow .detail{font-size:11.5px; color:var(--ink-soft); margin-top:2px;}
  .alertbadge{font-size:11.5px; font-weight:700; background:var(--burgundy-soft); color:var(--burgundy); padding:3px 9px; border-radius:999px; flex-shrink:0;}
  .barrow{margin-bottom:10px;}
  .barrow .barlbl{display:flex; justify-content:space-between; font-size:12px; color:var(--ink-soft); margin-bottom:4px;}
  .bartrack{background:var(--cream); border-radius:4px; height:8px; overflow:hidden;}
  .barfill{background:var(--wheat); height:100%; border-radius:4px;}
  .editbtn{flex-shrink:0; padding:7px 12px; border-radius:8px; border:1.5px solid var(--wheat); background:var(--wheat-soft); color:var(--wheat); font-size:12px; font-weight:700; cursor:pointer;}
  .rowactions{display:flex; gap:6px; flex-shrink:0;}
  .delbtn{flex-shrink:0; padding:7px 10px; border-radius:8px; border:1.5px solid var(--burgundy); background:var(--burgundy-soft); color:var(--burgundy); font-size:13px; font-weight:700; cursor:pointer;}
  .editbanner{background:var(--wheat-soft); color:var(--wheat); border:1px solid var(--wheat); border-radius:10px; padding:10px 14px; margin-bottom:14px; font-size:13px; font-weight:600;}
  .editbanner [data-cancel-edit]{text-decoration:underline; cursor:pointer;}
  .ghostbtn{width:100%; padding:9px; border-radius:10px; border:1.5px solid var(--line); background:transparent; color:var(--ink-soft); font-size:13px; font-weight:600; cursor:pointer;}

  .empty{text-align:center; padding:30px 10px; color:var(--ink-soft); font-size:13px;}
  .empty .glyph{font-size:30px; margin-bottom:8px;}

  .visitrow{border-bottom:1px dashed var(--line); padding:10px 0; font-size:12.5px; cursor:pointer;}
  .visitrow:last-child{border-bottom:none;}
  .visitrow .top{display:flex; justify-content:space-between; font-weight:600; color:var(--ink);}
  .visitrow .bottom{color:var(--ink-soft); margin-top:2px;}
  .visitdetail{background:var(--cream); border-radius:10px; padding:10px 12px; margin-top:8px; font-size:12px; color:var(--ink-soft); display:none;}
  .visitdetail.show{display:block;}
  .visitdetail .drow{display:flex; justify-content:space-between; padding:3px 0; border-bottom:1px dashed var(--line);}
  .visitdetail .drow:last-child{border-bottom:none;}
  .detailphotos{display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-top:8px;}
  .detailphotos img{width:100%; height:50px; object-fit:cover; border-radius:6px;}

  .loading{text-align:center; padding:40px 10px; color:var(--ink-soft); font-size:13px;}
  .err{background:var(--burgundy-soft); color:var(--burgundy); padding:10px 12px; border-radius:10px; font-size:12.5px; margin-bottom:12px;}
</style>

  function saveDraft(){

      localStorage.setItem(DRAFT_KEY, JSON.stringify({ form: state.form, savedAt: Date.now() }));
    }catch(e){ /* si el almacenamiento falla, no bloquea el resto de la app */ }

  function loadDraft(){
    try{
      var raw = localStorage.getItem(DRAFT_KEY);
      if(!raw) return null;
      var draft = JSON.parse(raw);
      // ignora borradores de más de 12 horas, para no revivir algo muy viejo por error
      if(!draft.savedAt || (Date.now()-draft.savedAt) > 12*60*60*1000){
        localStorage.removeItem(DRAFT_KEY);
        return null;
      }
      return draft;
    }catch(e){ return null; }
  }

  async function loadVisits(){
    if(CONFIG.SCRIPT_URL.indexOf('PEGA_AQUI') === 0){
      state.loading = false;
      state.error = 'Falta conectar la app con tu Google Sheet. Pega la URL de tu Apps Script en la CONFIGURACIÓN del código.';
      render();
      return;
    }
    state.loading = true; render();
    try{
      var resp = await fetch(CONFIG.SCRIPT_URL, { method:'GET' });
      if(!resp.ok) throw new Error('http '+resp.status);
      var data = await resp.json();
      var visits = Array.isArray(data) ? data : (data && data.visits) || [];
      visits.sort(function(a,b){ return (b.ts||0)-(a.ts||0); });
      state.visits = visits;
      state.error = null;
    }catch(e){
      state.error = 'No se pudieron cargar los datos guardados. Revisa tu conexión a internet e intenta de nuevo.';
    }
    state.loading = false; render();
  }

  function scoreVisit(v){
    var vals = [];
    TRIPLE_ITEMS.forEach(function(i){ if(v.triple[i.key]!==null && v.triple[i.key]!==undefined) vals.push(v.triple[i.key]==='buena'); });
    SINO_ITEMS.forEach(function(i){ if(v.sino[i.key]!==null && v.sino[i.key]!==undefined) vals.push(v.sino[i.key]===i.goodVal); });
    if(vals.length===0) return null;
    var good = vals.filter(Boolean).length;
    return good/vals.length;
  }

  async function deleteVisitFromApp(id){
    var v = state.visits.find(function(x){ return x.id===id; });
    if(!v) return;
    if(!isToday(v.ts)){
      state.error = 'Esta visita ya no se puede eliminar porque quedó guardada de un día anterior.';
      render();
      return;
    }
    var ok = confirm('¿Seguro que quieres eliminar la visita de "'+v.tienda+'"? Esta acción no se puede deshacer.');
    if(!ok) return;
    try{
      if(CONFIG.SCRIPT_URL.indexOf('PEGA_AQUI') === 0) throw new Error('sin configurar');
      var resp = await fetch(CONFIG.SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action:'delete', id: id })
      });
      var result = await resp.json();
      if(!result || result.ok === false) throw new Error((result && result.error) || 'delete failed');
      state.visits = state.visits.filter(function(x){ return x.id !== id; });
      state.error = null;
      render();
    }catch(err){
      state.error = 'No se pudo eliminar la visita. Revisa tu conexión a internet e intenta de nuevo.';
      render();
    }
  }

  function useLocation(){
    try{
      if(!navigator.geolocation){
        state.locStatus = 'Este navegador no soporta ubicación GPS. Prueba con Chrome o Safari actualizados.';
        render(); return;
      }
      state.locStatus = 'Obteniendo ubicación...';
      render();

      function onError(err, triedLowAccuracy){
        try{
          if(err && err.code === 1){ // PERMISSION_DENIED
            state.locStatus = 'Permiso de ubicación bloqueado. Ve a Configuración del navegador → Permisos del sitio → Ubicación, y actívalo para esta app.';
            render();
          } else if(err && err.code === 2 && !triedLowAccuracy){ // POSITION_UNAVAILABLE: reintenta con precisión más baja
            navigator.geolocation.getCurrentPosition(onSuccess, function(err2){ onError(err2, true); },
              {enableHighAccuracy:false, timeout:12000, maximumAge:0});
          } else if(err && err.code === 2){
            state.locStatus = 'El GPS del celular no responde. Verifica que la ubicación esté activada en el celular (no solo en el navegador) e intenta de nuevo.';
            render();
          } else if(err && err.code === 3 && !triedLowAccuracy){ // TIMEOUT: reintenta con precisión más baja
            navigator.geolocation.getCurrentPosition(onSuccess, function(err2){ onError(err2, true); },
              {enableHighAccuracy:false, timeout:12000, maximumAge:0});
          } else {
            state.locStatus = 'No se pudo obtener la ubicación a tiempo (error: '+(err && err.message ? err.message : 'desconocido')+'). Sal a un lugar más abierto e intenta de nuevo.';
            render();
          }
        }catch(e2){
          state.locStatus = 'Ocurrió un error inesperado obteniendo la ubicación: '+e2.message;
          render();
        }
      }
      async function onSuccess(pos){
        state.form.lat = pos.coords.latitude;
        state.form.lng = pos.coords.longitude;
        state.locStatus = 'ok';
        state.geoStatus = 'buscando';
        render();
        try{
          var resp = await fetch('https://nominatim.openstreetmap.org/reverse?format=json&lat='+state.form.lat+'&lon='+state.form.lng+'&zoom=18&addressdetails=0');
          var data = await resp.json();
          if(data && data.display_name){
            state.form.localizacion = data.display_name;
          }
        }catch(e){ /* si falla la dirección, se dejan las coordenadas y el mapa igual funciona */ }
        state.geoStatus = null;
        render();
      }
      navigator.geolocation.getCurrentPosition(onSuccess, function(err){ onError(err, false); },
        {enableHighAccuracy:true, timeout:8000, maximumAge:0});
    }catch(e){
      state.locStatus = 'Ocurrió un error inesperado al activar el GPS: '+e.message;
      render();
    }
  }

  function resizeImage(file, maxW, cb, onError){
    var reader = new FileReader();
    reader.onerror = function(){ if(onError) onError('No se pudo leer el archivo de la foto.'); };
    reader.onload = function(e){
      var img = new Image();
      img.onerror = function(){ if(onError) onError('La foto no se pudo procesar (formato no compatible). Intenta tomarla de nuevo.'); };
      img.onload = function(){
        try{
          var scale = Math.min(1, maxW/img.width);
          var canvas = document.createElement('canvas');
          canvas.width = Math.max(1, Math.round(img.width*scale));
          canvas.height = Math.max(1, Math.round(img.height*scale));
          var ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          cb(canvas.toDataURL('image/jpeg', 0.6));
        }catch(err){
          if(onError) onError('No se pudo procesar la foto: '+err.message);
        }
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  function renderPhotoSlot(slot, f){
    var has = f.fotos[slot.key];
    var esOpcional = (slot.key==='vitrina_antes' || slot.key==='vitrina_despues') && f.tieneVitrinaHojaldre!==true;
    var procesando = f.fotoProcesando === slot.key;
    var html = '<div class="photoslot '+(has?'filled':'')+'">';
    if(procesando){
      html += '<div class="plus">⏳</div>';
    } else if(has){
      html += '<img src="'+has+'">';
    } else {
      html += '<div class="plus">＋</div>';
    }
    html += '<div class="lbl">'+(procesando?'Procesando...':slot.label+(esOpcional?' (opcional)':''))+'</div>';
    html += '<div class="phototabs">';
    html += '<label class="phototab">📷 Cámara<input type="file" accept="image/*" capture="environment" data-photo="'+slot.key+'" '+(procesando?'disabled':'')+'></label>';
    html += '<label class="phototab">🖼️ Galería<input type="file" accept="image/*" data-photo="'+slot.key+'" '+(procesando?'disabled':'')+'></label>';
    html += '</div>';
    html += '</div>';
    return html;
  }

      state.error = errMsg;
      render();

      impulsadora: f.impulsadora.trim(), tienda: f.tienda.trim(), director: f.director.trim(),
      distrito: f.distrito, recibe: f.recibe.trim(),
      localizacion: f.localizacion.trim(), lat: f.lat, lng: f.lng,
      ventaAcumDinero: (Number(f.ventaPanaderia)||0) + (Number(f.ventaReposteria)||0) + (f.tieneVitrinaHojaldre===true ? Number(f.ventaHojaldres)||0 : 0),
      metaDinero: Number(f.metaDinero)||0,
      tieneVitrinaHojaldre: f.tieneVitrinaHojaldre,
      ventaHojaldres: f.tieneVitrinaHojaldre===true ? (Number(f.ventaHojaldres)||0) : 0, ventaPanaderia: Number(f.ventaPanaderia)||0, ventaReposteria: Number(f.ventaReposteria)||0,
      triple: Object.assign({}, f.triple), sino: Object.assign({}, f.sino),
      tieneCanastillas: f.tieneCanastillas,
      canastillasPanaderia: f.tieneCanastillas===true ? (Number(f.canastillasPanaderia)||0) : 0,
      canastillasReposteria: f.tieneCanastillas===true ? (Number(f.canastillasReposteria)||0) : 0,
      fotos: Object.assign({}, f.fotos), obs: f.obs.trim()
    };
    try{
      if(CONFIG.SCRIPT_URL.indexOf('PEGA_AQUI') === 0) throw new Error('sin configurar');
      var resp = await fetch(CONFIG.SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // evita preflight CORS
        body: JSON.stringify(record)
      });
      var result = await resp.json();
      if(!result || result.ok === false) throw new Error((result && result.error) || 'save failed');
      var savedRecord = result.record || record;
      if(isEdit){
        var idx = state.visits.findIndex(function(v){ return v.id===savedRecord.id; });
        if(idx !== -1) state.visits[idx] = savedRecord; else state.visits.unshift(savedRecord);
      } else {
        state.visits.unshift(savedRecord);
      }
      state.error = null;
      state.editingId = null;
      state.form = emptyForm(record.impulsadora, '', record.distrito);
      state.locStatus = null;
      state.draftRestoredAt = null;
      clearDraft();
      state.showStamp = true;
      render();
      setTimeout(function(){ state.showStamp=false; render(); }, 1400);
    }catch(err){
      state.error = 'No se pudo guardar la visita. Revisa tu conexión a internet e intenta de nuevo.';
    }
    state.submitting = false; render();
  }

  function aggregateByTienda(visits){
    var map = {};
    visits.forEach(function(v){
      var k = v.tienda || 'Sin nombre';
      if(!map[k]) map[k] = {name:k, count:0, venta:0, meta:0};
      map[k].count++;
      map[k].venta += v.ventaAcumDinero;
      map[k].meta += v.metaDinero;
    });
    return Object.values(map);
  }

  function aggregateByImpulsadora(visits){
    var map = {};
    visits.forEach(function(v){
      var k = v.impulsadora || 'Sin nombre';
      if(!map[k]) map[k] = {name:k, count:0, venta:0, meta:0};
      map[k].count++;
      map[k].venta += v.ventaAcumDinero;
      map[k].meta += v.metaDinero;
    });
    return Object.values(map).sort(function(a,b){
      var pa = a.meta ? a.venta/a.meta : -1;
      var pb = b.meta ? b.venta/b.meta : -1;
      return pb-pa;
    });
  }

  function countRedFlags(v){
    var bad = 0; var labels = [];
    TRIPLE_ITEMS.forEach(function(i){
      if(i.key==='vitrina' && v.tieneVitrinaHojaldre!==true) return;
      if(v.triple[i.key]==='mala'){ bad++; labels.push(i.label); }
    });
    SINO_ITEMS.forEach(function(i){
      if(v.sino[i.key]!==null && v.sino[i.key]!==undefined && v.sino[i.key]!==i.goodVal){ bad++; labels.push(i.label); }
    });
    return {count:bad, labels:labels};
  }

  function filteredVisits(){
    var list = state.visits;
    var f = state.filters;
    if(f.distrito) list = list.filter(function(v){ return v.distrito===f.distrito; });
    if(f.impulsadora) list = list.filter(function(v){ return v.impulsadora===f.impulsadora; });
    if(f.periodo === 'hoy'){
      list = list.filter(function(v){ return isToday(v.ts); });
    } else if(f.periodo === 'semana'){
      var startOfWeek = new Date();
      var day = startOfWeek.getDay(); // 0=domingo, 1=lunes...
      var diffToMonday = (day===0 ? 6 : day-1);
      startOfWeek.setDate(startOfWeek.getDate()-diffToMonday);
      startOfWeek.setHours(0,0,0,0);
      list = list.filter(function(v){ return v.ts && v.ts >= startOfWeek.getTime(); });
    } else if(f.periodo === 'mes'){
      var now = new Date();
      var startOfMonth = new Date(now.getFullYear(), now.getMonth(), 1, 0,0,0,0);
      list = list.filter(function(v){ return v.ts && v.ts >= startOfMonth.getTime(); });
    }
    return list;
  }

  function field(labelText, inputHtml){ return '<label>'+labelText+'</label>'+inputHtml; }
  function input(type, name, value, placeholder){
    var realType = (type==='digits') ? 'text' : type;
    var inputmode = (type==='number') ? 'decimal' : (type==='digits' ? 'numeric' : 'text');
    return '<input type="'+realType+'" data-field="'+name+'" value="'+escapeHtml(String(value))+'" placeholder="'+placeholder+'" inputmode="'+inputmode+'"'+(type==='digits'?' pattern="[0-9]*" data-numeric="1"':'')+'>';
  }
  function moneyField(labelText, name, digitsValue, placeholder){
    var display = digitsValue ? Number(digitsValue).toLocaleString('es-CO') : '';
    return '<label>'+labelText+'</label><div class="moneywrap"><span class="moneypre">$</span><input type="text" inputmode="numeric" data-money="'+name+'" value="'+escapeHtml(display)+'" placeholder="'+(placeholder||'0')+'"></div>';
  }
  function select(name, options, value, placeholder){
    var html = '<select data-field="'+name+'">';
    if(placeholder){
      html += '<option value="" '+(!value?'selected':'')+' disabled>'+escapeHtml(placeholder)+'</option>';
    }
    options.forEach(function(o){ html += '<option value="'+escapeHtml(o)+'" '+(o===value?'selected':'')+'>'+escapeHtml(o)+'</option>'; });
    html += '</select>';
    return html;
  }

  function captureFocus(){
    var active = document.activeElement;
    if(!active) return null;
    if(active.hasAttribute('data-field')){
      // Los inputs type="number" no soportan selectionStart/selectionEnd en varios
      // navegadores (lanzan error); en ese caso simplemente ubicamos el cursor al final.
      try{
        return {attr:'data-field', key:active.getAttribute('data-field'), start:active.selectionStart, end:active.selectionEnd};
      }catch(e){
        return {attr:'data-field', key:active.getAttribute('data-field'), end:true};
      }
    }
    if(active.hasAttribute('data-money')) return {attr:'data-money', key:active.getAttribute('data-money'), end:true};
    if(active.id === 'obs') return {attr:'id', key:'obs', start:active.selectionStart, end:active.selectionEnd};
    return null;
  }
  function restoreFocus(info){
    if(!info) return;
    var el = info.attr==='id' ? document.getElementById(info.key) : root.querySelector('['+info.attr+'="'+info.key+'"]');
    if(!el) return;
    el.focus();
    try{
      if(info.end === true || typeof info.start !== 'number'){
        var len = el.value.length;
        el.setSelectionRange(len, len);
      } else {
        el.setSelectionRange(info.start, info.end);
      }
    }catch(e){ /* algunos navegadores no soportan setSelectionRange en type=number, se ignora */ }
  }

      html += '<div class="card"><div class="card-title">🏆 Tiendas con mejor cumplimiento</div>';
      if(mejores.length===0){
        html += '<div class="empty">Sin datos suficientes en este filtro.</div>';
      } else {
        mejores.forEach(function(t){
          var p = t.venta/t.meta;
          html += '<div class="rowcard">';
          html += '<div><div class="name">'+escapeHtml(t.name)+'</div><div class="meta">'+t.count+' visita(s) &middot; '+fmtMoney(t.venta)+'</div></div>';
          html += '<div class="pill '+pctClass(p)+'">'+fmtPct(p)+'</div>';
          html += '</div>';
        });
      }
      html += '</div>';

      html += '<div class="card"><div class="card-title">🔻 Tiendas con peor cumplimiento</div>';
      if(peores.length===0){
        html += '<div class="empty">Sin datos suficientes en este filtro.</div>';
      } else {
        peores.forEach(function(t){
          var p = t.venta/t.meta;
          html += '<div class="rowcard">';
          html += '<div><div class="name">'+escapeHtml(t.name)+'</div><div class="meta">'+t.count+' visita(s) &middot; '+fmtMoney(t.venta)+'</div></div>';
          html += '<div class="pill '+pctClass(p)+'">'+fmtPct(p)+'</div>';
          html += '</div>';
        });
      }
      html += '</div>';
    }

    html += '<div class="stampwrap '+(state.showStamp?'show':'')+'"><div class="stamp"><span class="big">¡Registrada!</span><span class="small">Gracias por tu visita</span></div></div>';

    root.innerHTML = html;
    bindAll();
    restoreFocus(focusInfo);
    scheduleDraftSave();
  }

  function cap(s){ return s.charAt(0).toUpperCase()+s.slice(1); }
  function detailRow(label, value){ return '<div class="drow"><span>'+label+'</span><span>'+value+'</span></div>'; }

  function bindTabs(){
    document.querySelectorAll('.tab').forEach(function(el){
      el.addEventListener('click', function(){ state.tab = el.getAttribute('data-tab'); render(); });
    });
    document.querySelectorAll('[data-periodo]').forEach(function(el){
      el.addEventListener('click', function(){ state.filters.periodo = el.getAttribute('data-periodo'); render(); });
    });
    document.querySelectorAll('[data-filterselect]').forEach(function(el){
      el.addEventListener('change', function(){ state.filters[el.getAttribute('data-filterselect')] = el.value; render(); });
    });
    document.querySelectorAll('[data-edit-visit]').forEach(function(el){
      el.addEventListener('click', function(){ startEdit(el.getAttribute('data-edit-visit')); });
    });
    document.querySelectorAll('[data-delete-visit]').forEach(function(el){
      el.addEventListener('click', function(){ deleteVisitFromApp(el.getAttribute('data-delete-visit')); });
    });
    document.querySelectorAll('[data-cancel-edit]').forEach(function(el){
      el.addEventListener('click', function(){ cancelEdit(); });
    });
    document.querySelectorAll('[data-discard-draft]').forEach(function(el){
      el.addEventListener('click', function(){
        clearDraft();
        state.draftRestoredAt = null;
        state.form = emptyForm();
        render();
      });
    });
  }

  function bindAll(){
    bindTabs();
    document.querySelectorAll('[data-field]').forEach(function(el){
      el.addEventListener('input', function(){
        if(el.hasAttribute('data-numeric')){
          var clean = el.value.replace(/[^0-9]/g,'');
          if(clean !== el.value) el.value = clean;
          updateForm(el.getAttribute('data-field'), clean);
        } else {
          updateForm(el.getAttribute('data-field'), el.value);
        }
      });
      el.addEventListener('change', function(){ updateForm(el.getAttribute('data-field'), el.value); });
    });
    document.querySelectorAll('[data-triple]').forEach(function(el){
      el.addEventListener('click', function(){
        var key = el.getAttribute('data-triple'); var val = el.getAttribute('data-val');
        var current = state.form.triple[key];
        updateTriple(key, current===val ? null : val);
      });
    });
    document.querySelectorAll('[data-sino]').forEach(function(el){
      el.addEventListener('click', function(){
        var key = el.getAttribute('data-sino'); var val = el.getAttribute('data-val')==='true';
        var current = state.form.sino[key];
        updateSino(key, current===val ? null : val);
      });
    });
    document.querySelectorAll('[data-sino2]').forEach(function(el){
      el.addEventListener('click', function(){
        var key = el.getAttribute('data-sino2'); var val = el.getAttribute('data-val')==='true';
        var current = state.form[key];
        updateForm(key, current===val ? null : val);
      });
    });
    document.querySelectorAll('[data-money]').forEach(function(el){
      el.addEventListener('input', function(){
        var digits = el.value.replace(/\D/g,'');
        state.form[el.getAttribute('data-money')] = digits;
        render();
      });
    });
    document.querySelectorAll('[data-photo]').forEach(function(el){
      el.addEventListener('change', function(){ handlePhoto(el.getAttribute('data-photo'), el); });
    });
    document.querySelectorAll('[data-expand]').forEach(function(el){
      el.addEventListener('click', function(){
        var id = el.getAttribute('data-expand');
        state.expanded[id] = !state.expanded[id];
        render();
      });
    });
    var locBtn = document.getElementById('locBtn');
    if(locBtn) locBtn.addEventListener('click', function(){
      try{ useLocation(); }
      catch(e){ state.locStatus = 'Error inesperado: '+e.message; render(); }
    });
    var formEl = document.getElementById('visitForm');
    if(formEl) formEl.addEventListener('submit', submitVisit);
    var exportBtn = document.getElementById('exportBtn');
    if(exportBtn) exportBtn.addEventListener('click', exportToExcel);
  }

  // ======================================================================
  // EXPORTAR A EXCEL
  // Genera un archivo .xlsx real (usando la librería SheetJS) con todas
  // las visitas cargadas, en columnas legibles. No modifica ni afecta el
  // guardado en Google Sheets — es solo una copia para descargar.
  // ======================================================================
  function boolLabel(v){ return v===true?'Sí':(v===false?'No':''); }
  function tripleLabel(v){ return v?cap(v):''; }

  function exportToExcel(){
    if(typeof XLSX === 'undefined'){
      alert('No se pudo cargar el componente de Excel. Revisa tu conexión a internet e intenta de nuevo.');
      return;
    }
    var visits = state.visits.slice().sort(function(a,b){ return (b.ts||0)-(a.ts||0); });

    var headers = [
      'Fecha','Hora','Impulsadora','Tienda','Director tienda','Distrito','Recibió la visita','Localización',
      'Meta $','Venta acumulada $','Cumplimiento %','Venta Panadería $','Venta Repostería $',
      '¿Vitrina hojaldre?','Venta Hojaldres $',
      'POP','Material manual','Vitrina','Portafolio',
      'Agotados','Limpieza','Rotación','Rotulado','Almacenamiento',
      '¿Tiene canastillas?','Canastillas Panadería','Canastillas Repostería','Observaciones'
    ];

    var rows = visits.map(function(v){
      var pct = v.metaDinero ? (v.ventaAcumDinero / v.metaDinero) : null;
      return [
        v.fecha||'', v.hora||'', v.impulsadora||'', v.tienda||'', v.director||'', v.distrito||'', v.recibe||'', v.localizacion||'',
        v.metaDinero||0, v.ventaAcumDinero||0, (pct!==null ? Math.round(pct*1000)/10 : ''), v.ventaPanaderia||0, v.ventaReposteria||0,
        boolLabel(v.tieneVitrinaHojaldre), (v.tieneVitrinaHojaldre===true ? (v.ventaHojaldres||0) : ''),
        tripleLabel(v.triple.pop), tripleLabel(v.triple.manual), tripleLabel(v.triple.vitrina), tripleLabel(v.triple.portafolio),
        boolLabel(v.sino.agotados), boolLabel(v.sino.limpieza), boolLabel(v.sino.rotacion), boolLabel(v.sino.rotulado), boolLabel(v.sino.almacenamiento),
        boolLabel(v.tieneCanastillas), (v.tieneCanastillas===true ? (v.canastillasPanaderia||0) : ''), (v.tieneCanastillas===true ? (v.canastillasReposteria||0) : ''),
        v.obs||''
      ];
    });

    var ws = XLSX.utils.aoa_to_sheet([headers].concat(rows));
    ws['!cols'] = headers.map(function(h){ return { wch: Math.max(h.length + 2, 14) }; });
    ws['!autofilter'] = { ref: XLSX.utils.encode_range({ s:{r:0,c:0}, e:{r:rows.length, c:headers.length-1} }) };

    var wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Visitas');
    var fecha = new Date().toISOString().slice(0,10);
    XLSX.writeFile(wb, 'Visitas_Panificadora_'+fecha+'.xlsx');
  }

  var restoredDraft = loadDraft();
  if(restoredDraft){
    state.form = Object.assign(emptyForm(), restoredDraft.form);
    state.draftRestoredAt = restoredDraft.savedAt;
  }

  render();
  loadVisits();
})();
</script>
